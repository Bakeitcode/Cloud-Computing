info:
  name: proxy - add object
  type: http
  seq: 3

http:
  method: PUT
  url: "{{devUrl}}/proxy/{{bucketName}}/{{objectName}}"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "Alex",
        "course": "hw05"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
