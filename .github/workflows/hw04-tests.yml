name: hw04 - pytest (s3 -> lambda -> dynamodb)

on:
  push:
    branches:
      - feature-hw04
    paths:
      - hw04/**
      - .github/workflows/hw04-tests.yml

jobs:
  test_hw04:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest boto3 requests

      - name: Run hw04 pytest file
        env:
          HW04_BUCKET_NAME: ${{ secrets.HW04_BUCKET_NAME }}
          HW04_TABLE_NAME: ${{ secrets.HW04_TABLE_NAME }}
          # Optional: set this secret if you want to validate the read-lambda Function URL too
          HW04_FUNCTION_URL: ${{ secrets.HW04_FUNCTION_URL }}
          AWS_REGION: us-east-1
        run: |
          pytest -q hw04/pytests_hw04.py