# Trigger deployment only on push to main branch
on:
  push:
    branches:
      # Change this to whatever your feature branch is called! Is it feature-hw02 ? feature-hw03 ? feature-hw04 ?
      # It is most likely NOT main!
      - feature-hw02

jobs:
  deploy:
    name: Deploy to EC2 on master branch push
    # Your repo MUST be in a UConn GitHub Organization that has been configured with Runners. 
    # The runs-on value below MUST be "self-hosted" to leverage the runner.
    runs-on: self-hosted

    steps:
      # This step pulls the code from your repo and downloads it into the 
      #   Docker container running this CICD pipeline
      - name: Checkout the files
        uses: actions/checkout@v2

      - name: Deploy to Server 1
        # This step deploys the code to the EC2 instance. It is a reusable action that will do this for us!
        # UConn does not support node20, so we cannot used the latest version of easingthemes/ssh-deploy
        # Instead, we explicitly use v4.1.10
        uses: easingthemes/ssh-deploy@v4.1.10
        env:
          # You must create GitHub secrets for each of these env variables
          # SSH_PRIVATE_KEY is literally the RSA private key value. "Show key" in the "AWS Details" tab of the LL launch screen
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
          # The public dns of your EC2 instance. You must update this value every LL session! (Yes, this is annoying.)
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
          # Usually set to "ec2-user"
          REMOTE_USER: ${{ secrets.USERNAME }}
          # Limit the deploy to ONLY these files. Make sure it matches the folder structure in your repo.
          SOURCE: "hw02/" 
          # Local EC2 path to deploy the code. e.g. "~/server". Make sure it matches where you want to put the code on the EC2 instance.
          TARGET: ${{ secrets.TARGET_DIR }}
