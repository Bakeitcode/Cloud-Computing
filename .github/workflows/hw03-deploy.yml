name: Deploy HW03 static site to S3

on:
  push:
    branches:
      - feature-hw03

env:
  AWS_REGION: us-east-1
  BUCKET_NAME: "hw03-acr22003-website"

jobs:
  deploy_to_s3:
    name: Sync site files to S3
    runs-on: self-hosted

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy static site to S3 bucket
        run: aws s3 sync ./hw03 s3://${{ env.BUCKET_NAME }} --delete
  test_s3_real_boto3:
    name: Test S3 APIs (real boto3)
    runs-on: self-hosted
    env:
      AWS_REGION: us-east-1
      HW03_CLIENT_BUCKET: hw03-acr22003-client
      HW03_RESOURCE_BUCKET: hw03-acr22003-resource
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run boto3 tests
        run: |
          pytest -q hw03/test_client_api_boto.py hw03/test_resource_api_boto.py
  test_s3_mocked:
    name: Test S3 APIs (MagicMock)
    runs-on: self-hosted
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run mocked tests
        run: |
          pytest -q hw03/test_client_api_mock.py hw03/test_resource_api_mock.py